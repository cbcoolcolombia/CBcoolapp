<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBcool · Administración</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#17202a;font:16px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}header{background:#102a43;color:white;padding:20px;border-radius:14px;margin:8px 0 16px}h1{font-size:23px;margin:0}.card,.item{background:white;border:1px solid #dce4eb;border-radius:12px;padding:15px;margin:12px 0}input,textarea,button{display:block;width:100%;font:inherit;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #c8d2dc}button{background:#1261a0;color:white;border:0;font-weight:700}button.secondary{background:#e7edf3;color:#18344e}button.danger{background:#a83232}button:disabled{background:#dfe5eb;color:#64748b;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:110px}.hidden{display:none}.status{white-space:pre-wrap;background:#eef4f8;padding:11px;border-radius:8px;margin:10px 0}.small{font-size:13px;color:#596875}.nav-active{background:#102a43!important;color:#fff!important;box-shadow:none!important}.pill{font-size:12px;background:#edf2f7;border-radius:20px;padding:3px 8px;display:inline-block;margin:2px}.approved{background:#d9f4e5;color:#146c3b}.rejected{background:#fde2e2;color:#9b2222}.pending{background:#fff0c2;color:#765400}.blocked{background:#e5e7eb;color:#374151}.user-list-head,.user-line{display:grid;grid-template-columns:minmax(105px,1.15fr) minmax(100px,1fr) minmax(88px,.75fr);gap:10px;align-items:center}.user-list-head{padding:0 12px 7px;color:#596875;font-size:12px;font-weight:800;text-transform:uppercase}.user-line{padding:12px;background:#fff;border:1px solid #dce4eb;border-radius:10px}.user-line+.user-line{margin-top:8px}.user-line .uid{font-size:11px;overflow-wrap:anywhere}.user-line .user-name{font-size:15px;text-decoration:none;overflow-wrap:anywhere}.user-line .pill{margin:0;white-space:nowrap}.user-actions{padding:0 4px 8px}.user-actions .row{margin-top:0}.user-actions button{font-size:13px;padding:9px}@media(max-width:480px){.user-list-head,.user-line{grid-template-columns:minmax(85px,1fr) minmax(90px,1fr) auto;gap:6px}.user-line{padding:9px}.user-line .user-name{font-size:13px}.user-line .pill{font-size:10px;padding:3px 6px}.user-line .uid{font-size:10px}}.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:12px 0}.doc{border:1px solid #dce4eb;border-radius:10px;padding:10px;min-width:0}.doc img{width:100%;height:190px;object-fit:contain;background:#f4f6f8;border-radius:7px}.doc a{display:inline-block;margin-top:8px;overflow-wrap:anywhere}.meta{font-size:13px;color:#596875}.decision{background:#f0f7f2;border-radius:8px;padding:10px;margin-top:10px}.empty{padding:15px;background:white;border-radius:10px}.user-name{display:inline-block;width:auto;padding:0;margin:0;background:transparent;color:#145b91;text-align:left;text-decoration:underline;font-weight:800}.uid{font-size:12px;overflow-wrap:anywhere;color:#526273}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{width:auto;flex:1;min-width:105px}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.field{background:#f5f7fa;padding:9px;border-radius:8px;overflow-wrap:anywhere}.trip{border:1px solid #dce4eb;padding:10px;border-radius:9px;margin:8px 0}.back{width:auto;padding:8px 14px}
header{position:relative;padding:20px 82px 18px 20px;min-height:88px}
.header-logout{position:absolute;right:14px;top:14px;width:38px;height:38px;padding:0;margin:0;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:18px;background:#e7edf3;color:#18344e;border:1px solid #c8d2dc}
.header-logout.visible{display:flex}
.role-nav{display:flex;gap:10px;margin:0 0 14px}
.role-nav button{flex:1;margin:0;padding:13px 10px;border-radius:12px;background:#fff;color:#18344e;border:1px solid #c8d2dc;box-shadow:0 1px 3px #102a4310}
.role-nav button.nav-active{background:#102a43!important;color:#fff!important;border-color:#102a43}
.filters-card{padding:12px}
.filters-card .filters{margin-top:0}
@media(max-width:420px){.wrap{padding:10px}.role-nav{gap:7px}.role-nav button{font-size:14px;padding:11px 6px}header{padding-left:15px}}
</style></head><body><main class="wrap">
<header><h1>CBcool · Panel de administración</h1><div>Revisión de registros de pasajeros y conductores</div><button id="logoutBtn" class="header-logout" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">↪</button></header>
<div id="globalStatus" class="status">Preparando el panel…</div>
<section id="login" class="card"><h2>Iniciar sesión</h2><label>Correo electrónico<input id="email" type="email" autocomplete="username" value="cbcoolcolombia@gmail.com"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" placeholder="Contraseña de Supabase"></label><button id="loginBtn" type="button">Entrar</button><p class="small">Usa la contraseña del usuario administrador de Supabase. No la compartas.</p></section>
<section id="panel" class="hidden"><nav class="role-nav" aria-label="Tipo de usuario"><button id="driversBtn" type="button">Conductores</button><button id="passengersBtn" type="button">Pasajeros</button></nav><div class="card filters-card"><div class="filters"><button id="allBtn" class="secondary">Todos</button><button id="pendingBtn" class="secondary">Pendientes</button><button id="rejectedBtn" class="secondary">Rechazados</button><button id="blockedBtn" class="secondary">Bloqueados</button></div><div id="counts" class="status"></div></div><div id="users"></div><div id="userDetail" class="card hidden"></div></section>
</main><script>
(function(){
const status=document.getElementById('globalStatus');function show(s){status.textContent=s}
function loadSdk(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar '+url));document.head.appendChild(s)})}
async function start(){try{show('Conectando con Supabase…');try{await loadSdk('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')}catch(e){await loadSdk('https://unpkg.com/@supabase/supabase-js@2')}
if(!window.supabase?.createClient)throw new Error('No se pudo iniciar la biblioteca de conexión. Revisa internet.');
const sb=window.supabase.createClient('https://tljaytdxguqeehlqxmxu.supabase.co','sb_publishable_DXB8kqrBSf9gjPxsuLMEFw_Dd3aZ8YF');
const $=id=>document.getElementById(id);let currentView='all',currentRole='driver';const BUCKET='cbcool-private-documents';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateFmt(v){if(!v)return 'No disponible';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}
function statusInfo(u){if(u.is_blocked)return ['Bloqueado','blocked'];let s=u.verification_status||'pending';if(s==='approved')return ['Activo','approved'];if(s==='rejected')return ['Rechazado','rejected'];return ['Pendiente','pending']}
function niceKey(k){return String(k).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function pretty(v){if(v===null||v===undefined||v==='')return 'No registrado';if(typeof v==='object')return JSON.stringify(v,null,2);return String(v)}
async function docsFor(ids){if(!ids.length)return {};const {data,error}=await sb.from('user_documents').select('id,user_id,document_type,storage_path,original_name,mime_type,review_status,uploaded_at').in('user_id',ids).order('uploaded_at',{ascending:false});if(error){console.warn('No se pudieron consultar documentos:',error.message);return {_error:error.message}}const grouped={};for(const d of data||[]){let url=null;const signed=await sb.storage.from(BUCKET).createSignedUrl(d.storage_path,3600);if(!signed.error)url=signed.data?.signedUrl;else console.warn('No se pudo abrir documento',d.id,signed.error.message);(grouped[d.user_id]??=[]).push({...d,url});}return grouped}
function docMarkup(userDocs){return userDocs.map(d=>{const title=esc(d.document_type||d.original_name||'Documento');const file=esc(d.original_name||d.storage_path.split('/').pop());const image=(d.mime_type||'').startsWith('image/')||/\.(png|jpe?g|webp|gif)$/i.test(d.original_name||d.storage_path);return '<div class="doc"><b>'+title+'</b><div class="meta">'+file+' · '+dateFmt(d.uploaded_at)+'</div>'+(d.url?(image?'<a href="'+esc(d.url)+'" target="_blank" rel="noopener"><img src="'+esc(d.url)+'" alt="'+title+'" loading="lazy"></a>':'<a href="'+esc(d.url)+'" target="_blank" rel="noopener">Ver / descargar documento</a>'):'<p class="meta">No se pudo generar el enlace. Revisa permisos del bucket.</p>')+'</div>'}).join('')}
async function listUsers(){show('Consultando '+(currentRole==='driver'?'conductores':'pasajeros')+'…');$('userDetail').classList.add('hidden');let q=sb.from('profiles').select('*').eq('role',currentRole).order('created_at',{ascending:false});if(currentView==='pending')q=q.eq('verification_status','pending').or('is_blocked.is.null,is_blocked.eq.false');else if(currentView==='rejected')q=q.eq('verification_status','rejected').or('is_blocked.is.null,is_blocked.eq.false');else if(currentView==='blocked')q=q.eq('is_blocked',true);const {data,error}=await q;if(error){show('Error al cargar perfiles: '+error.message);return}const rows=data||[];$('counts').textContent=(currentRole==='driver'?'Conductores':'Pasajeros')+' encontrados: '+rows.length+' · '+({all:'Todos',pending:'Pendientes',rejected:'Rechazados',blocked:'Bloqueados'}[currentView]);$('users').innerHTML=rows.length?'<div class="user-list-head"><span>N.º usuario</span><span>Nombre</span><span>Estado</span></div>'+rows.map(u=>{const [st,cl]=statusInfo(u);const name=u.display_name||u.personal_data?.name||u.personal_data?.nombre||'Sin nombre';return '<article class="item"><div class="user-line"><div class="uid">'+esc(u.user_id)+'</div><button type="button" class="user-name" data-open="'+esc(u.user_id)+'">'+esc(name)+'</button><div><span class="pill '+cl+'">'+st+'</span></div></div><div class="user-actions"><div class="meta">Teléfono: '+esc(u.phone||'No registrado')+' · Registro: '+dateFmt(u.created_at)+'</div><div class="row">'+(u.verification_status==='pending'&&!u.is_blocked?'<button type="button" data-approve="'+esc(u.user_id)+'">Aprobar</button><button type="button" class="danger" data-reject="'+esc(u.user_id)+'">Rechazar</button>':'')+'<button type="button" class="'+(u.is_blocked?'secondary':'danger')+'" data-block="'+esc(u.user_id)+'" data-value="'+(u.is_blocked?'false':'true')+'">'+(u.is_blocked?'Desbloquear':'Bloquear')+'</button></div></div></article>'}).join(''):'<div class="empty">No hay usuarios en esta categoría.</div>';
$('users').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));$('users').querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>setBlocked(b.dataset.block,b.dataset.value==='true'));$('users').querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>review(b.dataset.approve,'approved',null));$('users').querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{const reason=prompt('Escribe el motivo del rechazo:');if(!reason?.trim()){show('No se realizó el rechazo: falta el motivo.');return}review(b.dataset.reject,'rejected',reason.trim())});show('Lista actualizada. Pulsa el nombre para abrir la ficha completa.');}
async function openDetail(id){show('Cargando ficha, documentos e historial de viajes…');$('userDetail').classList.remove('hidden');$('userDetail').innerHTML='Cargando ficha…';const {data:u,error}=await sb.from('profiles').select('*').eq('user_id',id).maybeSingle();if(error||!u){$('userDetail').innerHTML='No se pudo cargar la ficha: '+esc(error?.message||'Usuario no encontrado');show('Error al abrir la ficha.');return}const docs=await docsFor([id]);const userDocs=docs[id]||[];const tripCol=u.role==='driver'?'driver_id':'passenger_id';const {data:trips,error:te}=await sb.from('trips').select('id,passenger_id,driver_id,status,pickup,destination,fare,passenger_note,requested_at,updated_at').eq(tripCol,id).order('requested_at',{ascending:false}).limit(100);const [st,cl]=statusInfo(u);const pd=u.personal_data&&typeof u.personal_data==='object'?u.personal_data:{};const omit=new Set(['user_id','personal_data','role']);const fields=Object.entries(u).filter(([k])=>!omit.has(k)).map(([k,v])=>'<div class="field"><b>'+esc(niceKey(k))+'</b><div>'+esc(pretty(v))+'</div></div>').join('');const personal=Object.entries(pd).map(([k,v])=>'<div class="field"><b>'+esc(niceKey(k))+'</b><div>'+esc(pretty(v))+'</div></div>').join('');const tripHtml=(trips||[]).map(t=>'<div class="trip"><b>Viaje '+esc(t.id)+'</b><div>Estado: '+esc(t.status||'No disponible')+'</div><div>Fecha: '+dateFmt(t.requested_at)+'</div><div>Origen: '+esc(pretty(t.pickup))+'</div><div>Destino: '+esc(pretty(t.destination))+'</div><div>Tarifa: '+esc(t.fare??'No registrada')+'</div>'+(t.passenger_note?'<div>Nota: '+esc(t.passenger_note)+'</div>':'')+'</div>').join('');$('userDetail').innerHTML='<div class="detail-head"><h2>Ficha de '+(u.role==='driver'?'conductor':'pasajero')+'</h2><button type="button" class="secondary back" id="closeDetail">Cerrar ficha</button></div><h3>'+esc(u.display_name||pd.name||pd.nombre||'Sin nombre')+'</h3><div class="uid">Número único de registro: '+esc(u.user_id)+'</div><p><span class="pill '+cl+'">'+st+'</span></p><h3>Datos del perfil</h3><div class="detail-grid">'+fields+personal+'</div><h3>Documentos y fotografías</h3>'+(docs._error?'<p>No se pudieron consultar los documentos: '+esc(docs._error)+'</p>':userDocs.length?'<div class="docs">'+docMarkup(userDocs)+'</div>':'<p class="meta">No hay documentos registrados en user_documents para esta cuenta.</p>')+'<h3>Historial de viajes</h3>'+(te?'<p>No se pudo consultar el historial: '+esc(te.message)+'</p>':trips?.length?tripHtml:'<p class="meta">Esta cuenta todavía no tiene viajes registrados.</p>')+'<p class="meta">Se muestran hasta 100 viajes, del más reciente al más antiguo.</p>';$('closeDetail').onclick=()=>$('userDetail').classList.add('hidden');show('Ficha cargada. Los enlaces privados de documentos duran una hora.');}
async function setBlocked(id,blocked){const reason=blocked?(prompt('Motivo del bloqueo (opcional):')||''):null;show(blocked?'Bloqueando cuenta…':'Desbloqueando cuenta…');const {error}=await sb.rpc('cb_admin_set_user_blocked',{p_user_id:id,p_blocked:blocked,p_reason:reason});if(error){show('No se pudo cambiar el bloqueo: '+error.message+'. Primero ejecuta el SQL de activación que acompaña este panel.');return}show(blocked?'Cuenta bloqueada.':'Cuenta desbloqueada.');await listUsers()}
async function review(id,state,reason){show('Guardando decisión…');const {error}=await sb.rpc('admin_set_user_status',{p_user_id:id,p_status:state,p_reason:reason});if(error){show('No se pudo guardar: '+error.message);return}show('Decisión guardada. Actualizando lista…');await listUsers()}
async function enter(){show('Iniciando sesión…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){show('Error de inicio de sesión: '+error.message);return}const {data:{user}}=await sb.auth.getUser();const {data:profile,error:pe}=await sb.from('profiles').select('role').eq('user_id',user.id).maybeSingle();if(pe){show('No se pudo verificar el rol: '+pe.message);return}if(profile?.role!=='admin'){show('El correo inició sesión, pero su perfil no tiene rol admin.');return}$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('logoutBtn').classList.add('visible');$('driversBtn').classList.add('nav-active');await listUsers()}
$('loginBtn').onclick=enter;$('password').onkeydown=e=>{if(e.key==='Enter')enter()};function setView(v){currentView=v;['pendingBtn','allBtn','rejectedBtn','blockedBtn'].forEach(id=>$(id).classList.toggle('nav-active',id===({pending:'pendingBtn',all:'allBtn',rejected:'rejectedBtn',blocked:'blockedBtn'}[v])));listUsers()}function setRole(r){currentRole=r;$('driversBtn').classList.toggle('nav-active',r==='driver');$('passengersBtn').classList.toggle('nav-active',r==='passenger');setView('all')}$('driversBtn').onclick=()=>setRole('driver');$('passengersBtn').onclick=()=>setRole('passenger');$('pendingBtn').onclick=()=>setView('pending');$('allBtn').onclick=()=>setView('all');$('rejectedBtn').onclick=()=>setView('rejected');$('blockedBtn').onclick=()=>setView('blocked');$('logoutBtn').onclick=async()=>{await sb.auth.signOut();$('panel').classList.add('hidden');$('logoutBtn').classList.remove('visible');$('login').classList.remove('hidden');show('Sesión cerrada.')};const {data}=await sb.auth.getSession();if(data.session)await enter();else show('Panel listo. Escribe tu correo y contraseña y pulsa Entrar.');
}catch(e){show('No se pudo iniciar el panel: '+(e.message||e)+'. Comprueba internet y vuelve a abrir el archivo.')}}start();})();
</script></body></html>
